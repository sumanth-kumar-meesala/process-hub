name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One job that builds and publishes, inside the "github-pages" environment,
  # so it can read the environment secret GROQ_API_KEY
  # (Settings → Environments → github-pages → Environment secrets).
  # If your environment has a different name, change `name:` below to match it.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Groq key is available
        run: |
          if [ -z "$VITE_GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY was not found in the github-pages environment (or repository) secrets — the site will be built without a shared AI key."
          else
            echo "Shared Groq key found."
          fi
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: npm run build
        env:
          # Built into the site so everyone can use the AI. Anyone who opens the published site can read it.
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
